# Runs the whole app. Copy backend/.env.example to backend/.env and fill it in, then:
#   docker compose up --build
# Database and queue data are kept in ./data, so they survive Docker being stopped.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hireflow
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hireflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # BullMQ loses jobs if Redis evicts keys, and append-only keeps queued jobs on disk
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hireflow
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      PORT: 5000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Only the client is published. The browser reaches the backend through its /api rewrite.
  client:
    build:
      context: ./client
      args:
        BACKEND_URL: http://backend:5000
    environment:
      BACKEND_URL: http://backend:5000
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    depends_on:
      - backend
